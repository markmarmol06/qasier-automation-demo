name: Qasier automation
run-name: Qasier ${{ inputs.qasier_run_id }}   # lets Qasier find this run
on:
  workflow_dispatch:
    inputs:
      qasier_run_id:
        description: Qasier test run ID
        required: true
      qasier_test_ids:          # optional: lets Qasier re-run only failed tests
        description: Comma-separated test case IDs (empty = run everything)
        required: false
        default: ''
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npx playwright install --with-deps chromium
      - name: Run tests
        env:
          QASIER_RUN_ID: ${{ inputs.qasier_run_id }}
          QASIER_API_KEY: ${{ secrets.QASIER_API_KEY }}
          QASIER_TEST_IDS: ${{ inputs.qasier_test_ids }}
        run: |
          if [ -n "$QASIER_TEST_IDS" ]; then
            npx playwright test --grep "\b(${QASIER_TEST_IDS//,/|})\b"
          else
            npx playwright test
          fi
